<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - Bùi Nguyễn Hà Anh</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            background: linear-gradient(135deg, #5b247a, #1b4ea8 55%, #1bcedf);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        body::before, body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: 0;
        }
        body::before {
            width: 320px;
            height: 320px;
            top: -80px;
            right: -60px;
            background: rgba(255, 105, 180, 0.45);
        }
        body::after {
            width: 280px;
            height: 280px;
            bottom: -80px;
            left: -60px;
            background: rgba(255, 220, 90, 0.35);
        }
        .trang {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 780px;
            padding: 40px 20px 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .gio {
            text-align: center;
            margin-bottom: 26px;
        }
        .gio .so {
            font-size: 64px;
            font-weight: 200;
            letter-spacing: 2px;
            line-height: 1;
        }
        .gio .ngay {
            margin-top: 6px;
            font-size: 15px;
            opacity: 0.85;
        }

        .kinh {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .hoso {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 22px 26px;
            margin-bottom: 30px;
        }
        .anh {
            flex-shrink: 0;
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            border: 3px solid white;
            background: #ff7eb3;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .anh img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .hoso h1 {
            font-size: 24px;
        }
        .hoso p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .tieude {
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            margin: 0 6px 14px;
        }
        .luoi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 18px;
        }
        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 26px 16px 20px;
            color: white;
            text-decoration: none;
            transition: transform 0.25s, background 0.25s;
        }
        .app:hover {
            transform: translateY(-8px) scale(1.04);
            background: rgba(255, 255, 255, 0.26);
        }
        .app .bieutuong {
            width: 78px;
            height: 78px;
            border-radius: 22px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--nen);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
            margin-bottom: 14px;
        }
        .app h3 {
            font-size: 17px;
        }
        .app p {
            font-size: 12.5px;
            opacity: 0.85;
            margin-top: 4px;
        }
        .a1 { --nen: linear-gradient(135deg, #ff9a56, #ff5e62); }
        .a2 { --nen: linear-gradient(135deg, #43e97b, #1fb5a3); }
        .a3 { --nen: linear-gradient(135deg, #5ee7ff, #4776e6); }

        .dock {
            display: flex;
            justify-content: center;
            gap: 14px;
            padding: 12px 20px;
            margin: 34px auto 0;
        }
        .dock a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 14px;
            transition: background 0.25s;
        }
        .dock a:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            opacity: 0.75;
        }

        @media (max-width: 520px) {
            .gio .so {
                font-size: 52px;
            }
            .hoso {
                flex-direction: column;
                text-align: center;
            }
            .luoi {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="trang">

        <div class="gio">
            <div class="so" id="gio">--:--</div>
            <div class="ngay" id="ngay"></div>
        </div>

        <div class="kinh hoso">
            <div class="anh">
                BA
                <img src="CV%20ca%20nhan/anh%20dai%20dien.jpeg" alt="Bùi Nguyễn Hà Anh" onerror="this.remove()">
            </div>
            <div>
                <h1>Bùi Nguyễn Hà Anh</h1>
                <p>Sinh viên Công nghệ Thông tin - ĐH Sư phạm TP.HCM</p>
                <p>MSSV: 52.01.104.003</p>
            </div>
        </div>

        <div class="tieude">Bài thực hành</div>
        <div class="luoi">
            <a class="kinh app a1" href="https://popau0907-collab.github.io/2611comp180203/CV%20ca%20nhan/cvcanhan.html">
                <div class="bieutuong">👤</div>
                <h3>CV cá nhân</h3>
                <p>Giới thiệu và thời khóa biểu</p>
            </a>
            <a class="kinh app a2" href="https://popau0907-collab.github.io/2611comp180203/Hang%20hoa/hanghoa.html">
                <div class="bieutuong">🛒</div>
                <h3>Hàng hóa</h3>
                <p>Trang bán hàng</p>
            </a>
            <a class="kinh app a3" href="https://popau0907-collab.github.io/2611comp180203/Ho%20ca/hoca.html">
                <div class="bieutuong">🐠</div>
                <h3>Hồ cá</h3>
                <p>Hiệu ứng chuyển động</p>
            </a>
        </div>

        <div class="kinh dock">
            <a href="https://github.com/popau0907-collab" target="_blank">GitHub</a>
            <a href="https://www.facebook.com/annieee189" target="_blank">Facebook</a>
            <a href="mailto:popau0907gmail.com">Email</a>
        </div>

        <footer>&copy; 2026 Bản quyền thuộc về Bùi Nguyễn Hà Anh</footer>
    </div>

    <script>
        function capNhat() {
            var bay = new Date();
            var gio = String(bay.getHours()).padStart(2, "0");
            var phut = String(bay.getMinutes()).padStart(2, "0");
            document.getElementById("gio").textContent = gio + ":" + phut;
            document.getElementById("ngay").textContent = bay.toLocaleDateString("vi-VN", {
                weekday: "long", day: "numeric", month: "long", year: "numeric"
            });
        }
        capNhat();
        setInterval(capNhat, 1000);
    </script>
</body>
</html>
